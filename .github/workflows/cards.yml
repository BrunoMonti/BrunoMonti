name: Atualizar cartões do README

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: readme-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Criar pasta dos cartões
        run: mkdir -p profile

      - name: Gerar estatísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=BrunoMonti&show_icons=true&theme=github_dark&bg_color=0d1117&title_color=79aaff&text_color=c9d1d9&icon_color=79aaff&border_color=30363d'

          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar linguagens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'username=BrunoMonti&langs_count=8&layout=compact&theme=github_dark&bg_color=0d1117&title_color=79aaff&text_color=c9d1d9&border_color=30363d'

          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Salvar cartões no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Atualizar cartões do README" || exit 0
          echo "VERSÃO COM REBASE"
          git pull --rebase origin main
          git push origin main
